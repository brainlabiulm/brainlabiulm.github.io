<!doctype html>
<html lang="it" class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <title>/*[|template_title|]*/0</title>
    <style>
      :root {
        font-family: "Segoe UI", Arial, sans-serif;
        color: #25234a;
        background: #f1f2f9;
        --accent: #312b79;
        --ink: #04003c;
        --border: #dfe1ef;
        --muted: #686887;
      }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      .staticrypt-content { min-height: 100vh; padding: 28px 16px 42px; }
      .staticrypt-shell { width: min(100%, 560px); margin: 0 auto; }
      .staticrypt-header {
        padding: 23px 26px; color: #fff; background: var(--ink); border-radius: 10px 10px 0 0;
      }
      .eyebrow { color: #c1c2df; text-transform: uppercase; letter-spacing: .14em; font-size: 11px; font-weight: 800; }
      .brand { display: flex; align-items: center; gap: 11px; margin-top: 8px; }
      .mark { width: 31px; height: 31px; flex: none; }
      h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.03em; }
      .staticrypt-header p { margin: 7px 0 0; color: #c1c2df; font-size: 13px; line-height: 1.5; }
      .staticrypt-card { padding: 25px 26px 22px; background: #fff; border: 1px solid var(--border); border-top: 0; border-radius: 0 0 10px 10px; }
      .staticrypt-title { margin: 0 0 6px; color: #35335b; font-size: 18px; font-weight: 600; }
      .staticrypt-instructions { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.5; }
      .staticrypt-password-container { margin: 0 0 12px; }
      #staticrypt-password { width: 100%; padding: 12px 13px; color: #25234a; background: #fff; border: 1px solid #cccde2; border-radius: 6px; font: inherit; }
      #staticrypt-password:focus-visible, :focus-visible { outline: 3px solid #5e54a2; outline-offset: 2px; }
      .staticrypt-remember { display: flex; align-items: center; gap: 8px; margin: 0 0 17px; color: #686887; font-size: 12px; }
      .staticrypt-remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
      .staticrypt-decrypt-button { width: 100%; padding: 11px 15px; color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
      .staticrypt-decrypt-button:hover { background: #1e185c; }
      .staticrypt-footer { margin-top: 14px; color: var(--muted); font-size: 11px; line-height: 1.5; }
      .hidden { display: none !important; }
      .staticrypt-spinner-container { min-height: 100vh; display: grid; place-items: center; }
      .staticrypt-spinner { width: 30px; height: 30px; border: 4px solid #dfe1ef; border-right-color: var(--accent); border-radius: 50%; animation: spin .75s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (max-width: 520px) {
        .staticrypt-content { padding: 12px 11px 28px; }
        .staticrypt-header, .staticrypt-card { padding: 19px 18px; }
        h1 { font-size: 21px; }
      }
    </style>
  </head>
  <body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-spinner-container" aria-label="Caricamento">
      <div class="staticrypt-spinner" aria-hidden="true"></div>
    </div>

    <main id="staticrypt_content" class="staticrypt-content hidden">
      <div class="staticrypt-shell">
        <header class="staticrypt-header">
          <div class="eyebrow">BrainLab · risorse del laboratorio</div>
          <div class="brand">
            <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M1 17h7l4-11 6 21 4-13 3 3h6" fill="none" stroke="#c1c2df" stroke-width="2.5" stroke-linejoin="round" />
            </svg>
            <h1>Portale BrainLab</h1>
          </div>
          <p>Inserisci la password condivisa per aprire le pagine del laboratorio.</p>
        </header>

        <section class="staticrypt-card" aria-label="Accesso al portale">
          <p class="staticrypt-title">/*[|template_title|]*/0</p>
          <p class="staticrypt-instructions">/*[|template_instructions|]*/0</p>
          <form id="staticrypt-form" action="#" method="post">
            <div class="staticrypt-password-container">
              <input id="staticrypt-password" type="password" name="password" placeholder="/*[|template_placeholder|]*/0" autocomplete="current-password" autofocus />
            </div>
            <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
              <input id="staticrypt-remember" type="checkbox" name="remember" checked />
              <span>Ricordami su questo dispositivo</span>
            </label>
            <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
          </form>
          <div class="staticrypt-footer">Accesso con password condivisa · usa “Ricordami” solo su un dispositivo personale.</div>
        </section>
      </div>
    </main>

    <script>
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0";
      const isRememberEnabled = /*[|is_remember_enabled|]*/ 0;
      const staticryptConfig = /*[|staticrypt_config|]*/ 0;
      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };
      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (!isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();
          if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
        }
      };

      document.getElementById("staticrypt-form").addEventListener("submit", async function (event) {
        event.preventDefault();
        const password = document.getElementById("staticrypt-password").value;
        const remember = document.getElementById("staticrypt-remember").checked;
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, remember);
        if (!isSuccessful) window.alert(templateError);
      });
    </script>
  </body>
</html>
