                if (isSuccessful) {
                  showPage();
                  return;
                }
                clearSession();
              }
            } catch {
              clearSession();
            }
          }

          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          passwordField.focus();
        }, { once: true });

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          if (submitButton.disabled) return;
          submitButton.disabled = true;
          try {
            const { isSuccessful, hashedPassword } = await staticrypt.handleDecryptionOfPage(passwordField.value, false);
            if (!isSuccessful) {
              window.alert(templateError);
              passwordField.focus();
              return;
            }
            passwordField.value = "";
            try {
              sessionStorage.setItem(sessionKey, hashedPassword);
            } catch {
              // Allow this page to open even if the browser cannot keep the session.
            }
            showPage();
          } catch {
            window.alert("Decifratura non disponibile. Apri il portale via HTTPS con un browser aggiornato.");
          } finally {
            submitButton.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
