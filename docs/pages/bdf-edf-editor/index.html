          document.write(decryptedHtml);
          document.close();
        }

        function clearSession() {
          try {
            sessionStorage.removeItem(sessionKey);
          } catch {
            // Storage can be disabled by browser settings.
          }
        }

        window.addEventListener("load", async function () {
          // Remove credentials persisted by the old remember-me flow.
          try {
            localStorage.removeItem("staticrypt_passphrase");
            localStorage.removeItem("staticrypt_expiration");
          } catch {
            // Storage can be disabled by browser settings.
          }

          const logout = new URLSearchParams(location.search).has("staticrypt_logout") ||
            new URLSearchParams(location.hash.slice(1)).has("staticrypt_logout");
          if (logout) {
            clearSession();
          } else {
            try {
              const key = sessionStorage.getItem(sessionKey);
              if (key) {
                const { isSuccessful } = await staticrypt.handleDecryptionOfPageFromHash(key, false);
                if (isSuccessful) {
                  showPage();
                  return;
                }
                clearSession();
              }
            } catch {
              clearSession();
            }
          }

          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          passwordField.focus();
        }, { once: true });

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          if (submitButton.disabled) return;
          submitButton.disabled = true;
          try {
            const { isSuccessful, hashedPassword } = await staticrypt.handleDecryptionOfPage(passwordField.value, false);
            if (!isSuccessful) {
              window.alert(templateError);
              passwordField.focus();
              return;
            }
            passwordField.value = "";
            try {
              sessionStorage.setItem(sessionKey, hashedPassword);
            } catch {
              // Allow this page to open even if the browser cannot keep the session.
            }
            showPage();
          } catch {
            window.alert("Decifratura non disponibile. Apri il portale via HTTPS con un browser aggiornato.");
          } finally {
            submitButton.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
